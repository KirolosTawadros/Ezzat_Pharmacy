<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية عزت | طلباتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { medical: { green: '#059669', dark: '#047857', light: '#ecfdf5' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-medical-light text-medical-green p-2 rounded-lg">
                    <i class="fa-solid fa-staff-snake text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 leading-none">صيدلية عزت</h1>
                    <p class="text-sm text-gray-500">د. عزت فؤاد أبوسنان</p>
                </div>
            </a>
            <nav class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="nav-link text-gray-600 hover:text-medical-green font-medium transition">الرئيسية</a>
                <a href="products.html" class="nav-link text-gray-600 hover:text-medical-green font-medium transition">الأجهزة الطبية</a>
                <span class="text-gray-600 font-medium" id="user-name-nav"></span>
                <button onclick="logout()" class="text-gray-500 hover:text-red-500 transition text-sm font-medium">
                    <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
                </button>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-2xl text-gray-600 focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Page Header -->
    <div class="bg-medical-green text-white py-10">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold mb-2"><i class="fa-solid fa-list-ul ml-3"></i>طلباتي</h1>
            <p class="text-green-100">تتبع حالة طلباتك جميعاً في مكان واحد</p>
        </div>
    </div>

    <!-- Content -->
    <main class="flex-grow py-10">
        <div class="container mx-auto px-4 max-w-4xl">

            <div id="login-required" class="hidden text-center py-16">
                <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
                <h2 class="text-2xl font-bold text-gray-700 mb-4">يجب تسجيل الدخول لعرض الطلبات</h2>
                <a href="login.html" class="bg-medical-green text-white px-8 py-3 rounded-full font-bold hover:bg-medical-dark transition">تسجيل الدخول</a>
            </div>

            <div id="loading" class="hidden text-center py-16">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-medical-green mb-4"></i>
                <p class="text-gray-500">جارٍ تحميل طلباتك...</p>
            </div>

            <div id="empty-orders" class="hidden text-center py-16">
                <i class="fa-solid fa-box-open text-7xl text-gray-200 mb-4"></i>
                <h2 class="text-2xl font-bold text-gray-700 mb-2">لا توجد طلبات بعد</h2>
                <p class="text-gray-500 mb-8">ابدأ تسوقك الآن من أجهزة صيدلية عزت</p>
                <a href="products.html" class="bg-medical-green text-white px-8 py-3 rounded-full font-bold hover:bg-medical-dark transition">تصفح المنتجات</a>
            </div>

            <div id="orders-list" class="hidden space-y-5"></div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">© 2026 صيدلية عزت. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000/api';
        const STATUS_LABELS = {
            pending: { label: 'قيد الانتظار', color: 'bg-yellow-100 text-yellow-800', icon: 'fa-clock' },
            confirmed: { label: 'تم التأكيد', color: 'bg-blue-100 text-blue-800', icon: 'fa-circle-check' },
            delivered: { label: 'تم التوصيل', color: 'bg-green-100 text-green-800', icon: 'fa-truck-fast' },
            cancelled: { label: 'ملغي', color: 'bg-red-100 text-red-800', icon: 'fa-ban' },
        };

        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (!user) {
            document.getElementById('login-required').classList.remove('hidden');
        } else {
            document.getElementById('user-name-nav').textContent = user.name;
            loadOrders();
        }

        async function loadOrders() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const res = await fetch(`${API_BASE}/orders/my-orders`, { credentials: 'include' });
                if (res.status === 401) {
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();
                renderOrders(data.orders || []);
            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderOrders(orders) {
            const listEl = document.getElementById('orders-list');
            if (!orders.length) {
                document.getElementById('empty-orders').classList.remove('hidden');
                return;
            }
            listEl.classList.remove('hidden');
            listEl.innerHTML = orders.map(order => {
                const statusInfo = STATUS_LABELS[order.status] || STATUS_LABELS.pending;
                const date = new Date(order.created_at).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
                const items = order.items || [];
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-5 flex flex-wrap items-center justify-between gap-3 border-b border-gray-50">
                        <div>
                            <span class="text-gray-500 text-sm">طلب رقم </span>
                            <span class="font-bold text-gray-900">#${order.id}</span>
                            <span class="text-gray-400 text-sm mr-3">${date}</span>
                        </div>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-semibold ${statusInfo.color}">
                            <i class="fa-solid ${statusInfo.icon} text-xs"></i> ${statusInfo.label}
                        </span>
                    </div>
                    <div class="p-5">
                        <div class="space-y-2 mb-4">
                            ${items.map(i => `
                                <div class="flex justify-between text-sm text-gray-600">
                                    <span>${i.quantity}× ${i.product_name || 'منتج'}</span>
                                    <span>${(i.price_at_time * i.quantity).toLocaleString('ar-EG')} جنيه</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-3">
                            <div class="text-sm text-gray-500 flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-medical-green"></i>
                                <span class="truncate max-w-xs">${order.delivery_address}</span>
                            </div>
                            <div class="font-bold text-medical-green">${order.total.toLocaleString('ar-EG')} جنيه</div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function logout() {
            await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
