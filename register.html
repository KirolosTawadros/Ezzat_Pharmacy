<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية عزت | إنشاء حساب</title>
    <meta name="description" content="اشترك في صيدلية عزت وابدأ في الطلب بسهولة.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { medical: { green: '#059669', dark: '#047857', light: '#ecfdf5' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-medical-light text-medical-green p-2 rounded-lg">
                    <i class="fa-solid fa-staff-snake text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 leading-none">صيدلية عزت</h1>
                    <p class="text-sm text-gray-500">د. عزت فؤاد أبوسنان</p>
                </div>
            </a>
            <button id="mobile-menu-button" class="md:hidden text-2xl text-gray-600 focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Register Form -->
    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-medical-light rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-user-plus text-4xl text-medical-green"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">إنشاء حساب جديد</h2>
                <p class="text-gray-500 mt-2">انضم إلى عائلة صيدلية عزت</p>
            </div>

            <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6 text-sm"></div>
            <div id="success-msg" class="hidden bg-green-50 border border-green-200 text-medical-green rounded-xl p-4 mb-6 text-sm"></div>

            <form id="register-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">الاسم الكامل</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute top-1/2 -translate-y-1/2 right-4 text-gray-400"></i>
                        <input id="name" type="text" placeholder="محمد أحمد علي"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green transition" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">رقم الهاتف</label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute top-1/2 -translate-y-1/2 right-4 text-gray-400"></i>
                        <input id="phone" type="tel" placeholder="01xxxxxxxxx" dir="ltr"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green transition text-left" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">العنوان <span class="text-gray-400 font-normal">(اختياري)</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute top-3.5 right-4 text-gray-400"></i>
                        <textarea id="address" placeholder="العنوان للتوصيل..." rows="2"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green transition resize-none"></textarea>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute top-1/2 -translate-y-1/2 right-4 text-gray-400"></i>
                        <input id="password" type="password" placeholder="6 أحرف على الأقل"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green transition" required minlength="6">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-medical-green text-white py-3.5 rounded-xl font-bold text-lg hover:bg-medical-dark transition transform hover:-translate-y-0.5 shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    إنشاء الحساب
                </button>
            </form>

            <p class="text-center text-gray-500 mt-6">
                لديك حساب بالفعل؟
                <a href="login.html" class="text-medical-green font-bold hover:underline">تسجيل الدخول</a>
            </p>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000/api';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ إنشاء الحساب...';

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        name: document.getElementById('name').value.trim(),
                        phone: document.getElementById('phone').value.trim(),
                        address: document.getElementById('address').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'حدث خطأ. يرجى المحاولة مجدداً.';
                    errorEl.classList.remove('hidden');
                } else {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    successEl.textContent = 'تم إنشاء حسابك بنجاح! جارٍ تحويلك...';
                    successEl.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                }
            } catch (err) {
                errorEl.textContent = 'تعذر الاتصال بالخادم. تأكد من تشغيل السيرفر.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> إنشاء الحساب';
            }
        });
    </script>
</body>
</html>
