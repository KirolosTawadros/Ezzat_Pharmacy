<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية عزت | تسجيل الدخول</title>
    <meta name="description" content="سجّل دخولك لإتمام طلباتك من صيدلية عزت.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { medical: { green: '#059669', dark: '#047857', light: '#ecfdf5' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-medical-light text-medical-green p-2 rounded-lg">
                    <i class="fa-solid fa-staff-snake text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 leading-none">صيدلية عزت</h1>
                    <p class="text-sm text-gray-500">د. عزت فؤاد أبوسنان</p>
                </div>
            </a>
            <nav class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="nav-link text-gray-600 hover:text-medical-green font-medium transition">الرئيسية</a>
                <a href="products.html" class="nav-link text-gray-600 hover:text-medical-green font-medium transition">الأجهزة الطبية</a>
                <a href="cart.html" class="relative text-gray-600 hover:text-medical-green font-medium transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-count" class="hidden absolute -top-2 -left-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
                </a>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-2xl text-gray-600 focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <nav id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 flex flex-col p-4 gap-4 shadow-lg absolute w-full">
            <a href="index.html" class="nav-link text-gray-700 hover:text-medical-green font-medium">الرئيسية</a>
            <a href="products.html" class="nav-link text-gray-700 hover:text-medical-green font-medium">الأجهزة الطبية</a>
            <a href="cart.html" class="nav-link text-gray-700 hover:text-medical-green font-medium">السلة</a>
        </nav>
    </header>

    <!-- Login Form -->
    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-medical-light rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-user-circle text-4xl text-medical-green"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">تسجيل الدخول</h2>
                <p class="text-gray-500 mt-2">مرحباً بك مجدداً في صيدلية عزت</p>
            </div>

            <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6 text-sm"></div>
            <div id="success-msg" class="hidden bg-green-50 border border-green-200 text-medical-green rounded-xl p-4 mb-6 text-sm"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">رقم الهاتف</label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute top-1/2 -translate-y-1/2 right-4 text-gray-400"></i>
                        <input id="phone" type="tel" placeholder="01xxxxxxxxx" dir="ltr"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green focus:border-transparent transition text-left"
                            required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute top-1/2 -translate-y-1/2 right-4 text-gray-400"></i>
                        <input id="password" type="password" placeholder="••••••••"
                            class="w-full pr-11 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-green focus:border-transparent transition"
                            required>
                        <button type="button" id="toggle-password" class="absolute top-1/2 -translate-y-1/2 left-4 text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-medical-green text-white py-3.5 rounded-xl font-bold text-lg hover:bg-medical-dark transition transform hover:-translate-y-0.5 shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    تسجيل الدخول
                </button>
            </form>

            <p class="text-center text-gray-500 mt-6">
                ليس لديك حساب؟
                <a href="register.html" class="text-medical-green font-bold hover:underline">إنشاء حساب جديد</a>
            </p>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000/api';

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', () => {
            const pwdInput = document.getElementById('password');
            const icon = document.querySelector('#toggle-password i');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تسجيل الدخول...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        phone: document.getElementById('phone').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'حدث خطأ. يرجى المحاولة مجدداً.';
                    errorEl.classList.remove('hidden');
                } else {
                    successEl.textContent = data.message;
                    successEl.classList.remove('hidden');
                    // Store user info for navbar
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect');
                        window.location.href = redirect || (data.user.role === 'admin' ? 'admin/dashboard.html' : 'index.html');
                    }, 800);
                }
            } catch (err) {
                errorEl.textContent = 'تعذر الاتصال بالخادم. تأكد من تشغيل السيرفر.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
